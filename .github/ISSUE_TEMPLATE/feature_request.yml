name: Feature request
description: Suggest a capability or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Note: the roadmap in `docs/contextgate-competitive-gap-and-fix-plan.md` lists what is
        already planned. Multi-tenant billing, clustering and a plugin marketplace are
        explicitly out of scope.
