name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/gui-js/package-lock.json

      - name: Install dependencies
        working-directory: app/gui-js
        run: npm install

      - name: Lint
        working-directory: app/gui-js
        run: npm run lint

      - name: Test
        working-directory: app/gui-js
        run: npm test

  build-windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Developer Mode
        shell: powershell
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/gui-js/package-lock.json

      - name: Prepare build resources
        shell: bash
        run: |
          mkdir -p app/gui-js/build
          cp resources/icon.png app/gui-js/build/icon.png

      - name: Install dependencies
        working-directory: app/gui-js
        run: npm install

      - name: Decode signing certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: powershell
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WIN_CSC_LINK=$certPath" >> $env:GITHUB_ENV

      - name: Build Windows x64
        working-directory: app/gui-js
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --x64

      - name: Build Windows ia32
        working-directory: app/gui-js
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --ia32

      - name: Build Portable x64
        working-directory: app/gui-js
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win portable --x64

      - name: Clean signing certificate
        if: always()
        shell: powershell
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          if (Test-Path $certPath) { Remove-Item $certPath -Force }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            app/gui-js/dist/*.exe
            app/gui-js/dist/*.msi

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: dist/

      - name: List files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
