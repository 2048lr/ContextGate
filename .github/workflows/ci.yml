name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: app/gui-js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/gui-js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Version consistency
        run: npm run verify:version
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # 供应链告警不应阻塞无关的 PR；但结果会出现在 CI 摘要里
    continue-on-error: true
    defaults:
      run:
        working-directory: app/gui-js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/gui-js/package-lock.json
      - run: npm ci
      # app/gui-js/.npmrc 把 registry 指向 registry.npmmirror.com（国内装包快），
      # 但镜像没有实现 /-/npm/v1/security/* 审计端点，直接 audit 会 404 失败。
      # 装包仍然走镜像（lockfile 里的 resolved 也是镜像地址），只有审计这一步
      # 显式回到官方 registry。
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

  packaging:
    name: packaging config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/gui-js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/gui-js/package-lock.json
      - run: npm ci
      # 校验 Windows 目标架构与 Electron 版本一致（Electron 44+ 没有 ia32）
      - run: npm run prebuild:win
      # 体积报告：没有 dist 时会以非零码退出，这里容忍（首次 CI 运行还没有产物）
      - run: npm run report:size || true
