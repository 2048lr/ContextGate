stages:
  - build
  - release

variables:
  WORKDIR: app/gui-js

# ---------- Linux 构建 ----------
build-linux:
  stage: build
  image: node:22
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq fakeroot rpm dpkg
  script:
    - mkdir -p $WORKDIR/build
    - cp resources/icon.png $WORKDIR/build/icon.png
    - cd $WORKDIR
    - npm install
    - npx electron-builder --linux deb --x64
    - npx electron-builder --linux deb --arm64
    - npx electron-builder --linux rpm --x64
    - npx electron-builder --linux rpm --arm64
    - npx electron-builder --linux AppImage --x64
    - npx electron-builder --linux AppImage --arm64
    - rm -f dist/linux-* dist/*.yml
  artifacts:
    name: linux-packages
    paths:
      - app/gui-js/dist/*
    expire_in: 7 days
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------- Windows 构建 ----------
build-windows:
  stage: build
  before_script:
    - mkdir -p $WORKDIR/build
    - cp resources/icon.png $WORKDIR/build/icon.png
  script:
    - cd $WORKDIR
    - npm install
    - npx electron-builder --win nsis --x64
    - npx electron-builder --win nsis --ia32
    - npx electron-builder --win portable --x64
  artifacts:
    name: windows-packages
    paths:
      - app/gui-js/dist/*.exe
      - app/gui-js/dist/*.msi
    expire_in: 7 days
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------- 创建 Release ----------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-linux
    - build-windows
  script:
    - echo "Creating release $CI_COMMIT_TAG"
    - ls -la app/gui-js/dist/ || echo "fetching artifacts..."
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: $CI_COMMIT_TAG
    description: |
      ## ContextGate $CI_COMMIT_TAG
      
      自动构建发布。
      
      ### 下载
      - **Windows**: ContextGate-Setup-*.exe / Portable-*.exe
      - **Linux**: .deb / .rpm / .AppImage
    assets:
      links:
        - name: "linux-packages.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/app/gui-js/dist"
    ref: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
